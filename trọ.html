<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhập Số Điện Nước Theo Phòng</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        /* Khung chọn Thời Gian */
        .time-picker-card {
            background-color: #eef2f7;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .time-picker-card label {
            font-weight: bold;
            color: #34495e;
        }

        .time-picker-card select, .time-picker-card input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            outline: none;
        }

        /* Danh sách phòng */
        .room-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .room-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            background-color: #fafafa;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .room-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        }

        .room-header {
            font-weight: bold;
            font-size: 18px;
            color: #2980b9;
            margin-bottom: 12px;
            padding-bottom: 5px;
            border-bottom: 2px solid #3498db;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #3498db;
            outline: none;
        }

        /* Nút thao tác */
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit {
            background-color: #2ecc71;
            color: white;
        }

        .btn-submit:hover {
            background-color: #27ae60;
        }

        .btn-reset {
            background-color: #e74c3c;
            color: white;
        }

        .btn-reset:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bảng Nhập Số Điện Nước Theo Phòng</h1>

        <form id="utilityForm">
            <!-- Chọn Tháng & Năm -->
            <div class="time-picker-card">
                <label for="month">Tháng:</label>
                <select id="month" name="month" required>
                    <option value="1">Tháng 1</option>
                    <option value="2">Tháng 2</option>
                    <option value="3">Tháng 3</option>
                    <option value="4">Tháng 4</option>
                    <option value="5">Tháng 5</option>
                    <option value="6">Tháng 6</option>
                    <option value="7">Tháng 7</option>
                    <option value="8">Tháng 8</option>
                    <option value="9">Tháng 9</option>
                    <option value="10" selected>Tháng 10</option>
                    <option value="11">Tháng 11</option>
                    <option value="12">Tháng 12</option>
                </select>

                <label for="year">Năm:</label>
                <input type="number" id="year" name="year" value="2026" min="2020" max="2099" required>
            </div>

            <!-- Danh sách các phòng nhập số điện nước -->
            <div class="room-list">

                <!-- Phòng 101 -->
                <div class="room-card">
                    <div class="room-header">Phòng 101</div>
                    <div class="form-group">
                        <label for="p101_dien">Số điện (kWh):</label>
                        <input type="number" id="p101_dien" name="p101_dien" placeholder="Nhập chỉ số điện..." min="0">
                    </div>
                    <div class="form-group">
                        <label for="p101_nuoc">Số nước (m³):</label>
                        <input type="number" id="p101_nuoc" name="p101_nuoc" placeholder="Nhập chỉ số nước..." min="0">
                    </div>
                </div>

                <!-- Phòng 102 -->
                <div class="room-card">
                    <div class="room-header">Phòng 102</div>
                    <div class="form-group">
                        <label for="p102_dien">Số điện (kWh):</label>
                        <input type="number" id="p102_dien" name="p102_dien" placeholder="Nhập chỉ số điện..." min="0">
                    </div>
                    <div class="form-group">
                        <label for="p102_nuoc">Số nước (m³):</label>
                        <input type="number" id="p102_nuoc" name="p102_nuoc" placeholder="Nhập chỉ số nước..." min="0">
                    </div>
                </div>

                <!-- Phòng 201 -->
                <div class="room-card">
                    <div class="room-header">Phòng 201</div>
                    <div class="form-group">
                        <label for="p201_dien">Số điện (kWh):</label>
                        <input type="number" id="p201_dien" name="p201_dien" placeholder="Nhập chỉ số điện..." min="0">
                    </div>
                    <div class="form-group">
                        <label for="p201_nuoc">Số nước (m³):</label>
                        <input type="number" id="p201_nuoc" name="p201_nuoc" placeholder="Nhập chỉ số nước..." min="0">
                    </div>
                </div>

                <!-- Phòng 202 -->
                <div class="room-card">
                    <div class="room-header">Phòng 202</div>
                    <div class="form-group">
                        <label for="p202_dien">Số điện (kWh):</label>
                        <input type="number" id="p202_dien" name="p202_dien" placeholder="Nhập chỉ số điện..." min="0">
                    </div>
                    <div class="form-group">
                        <label for="p202_nuoc">Số nước (m³):</label>
                        <input type="number" id="p202_nuoc" name="p202_nuoc" placeholder="Nhập chỉ số nước..." min="0">
                    </div>
                </div>

            </div>

            <!-- Nút bấm -->
            <div class="btn-group">
                <button type="reset" class="btn-reset">Xóa tất cả</button>
                <button type="submit" class="btn-submit">Lưu số liệu</button>
            </div>
        </form>
    </div>

    <script>
        // Xử lý khi bấm nút "Lưu số liệu"
        document.getElementById('utilityForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Đã nhận dữ liệu thành công!');
        });
    </script>

</body>
</html>
